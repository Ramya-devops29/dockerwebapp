version: "3.3"

services:
  devopsdb:
    image: shaikmustafa/automation:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork
  application:
    image: shaikmustafa/automation:app
    ports:
      - "2222:8080"
    networks:
      - hisnetwork
      
networks:
    mynetwork:
       driver: bridge
    hisnetwork:
       driver: bridge
