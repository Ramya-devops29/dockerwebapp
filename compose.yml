services:

  devopsdb:
    image: shaikmustafa/automation:db
    ports:
      - "3306:3306"
    networks:
      - mynetwork
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  application:
    image: shaikmustafa/automation:app
    ports:
      - "2222:8080"
    networks:
      - mynetwork
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

networks:
  mynetwork:
    driver: overlay
